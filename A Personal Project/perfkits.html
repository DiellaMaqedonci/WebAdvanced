<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Personal Project - Perf Kits</title>
   <link rel="stylesheet" href="style.css">

<style>

#logo_perf{
    height: 165px;
    width: 300px;
    background-color: rgb(215, 205, 219);
    border-radius: 50%;
}


/*Section 1*/
#section-1_perf{
    background-color: #5a4d5a;
    height: 400px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


.container{
    margin-left: auto;
    margin-right: auto;
    height: 100%;
}


header{
    padding: 55px;
    display: flex;
    justify-content: space-around;
}


.nav_perf ul li{
    display: inline-block;
    padding: 10px 16px;
}


.nav_perf ul li a{
    text-decoration: none;
    color: white;
}


.nav_perf ul li.active{
    background-color: none;
    font-size: 20px;
}


.nav_perf ul li.active:hover{
    background-color: rgb(223, 205, 230);
    border-radius: 5px;
    font-size: 20px;
}



/*Section-2*/
#section-2_perf{
    background-color: #ecdbec;
    height: 750px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


h2{
    text-align:center;
    margin:0 0 20px 0;
    font-size:50px;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #675769;
}

.products-box{
    display: flex;
    gap: 100px;
    justify-content: center;
}

.product{
    background: rgb(#b37c9a, green, blue);
    border-radius:12px;
    overflow:hidden;
    box-shadow:0 4px 10px rgba(0,0,0,0.1);
    text-align:center;
    transition:0.3s;
}

.product:hover{
    transform:translateY(-8px);
}

.product img{
    width:300px;
    height:400px;
    object-fit:cover;
}

.product h3{
    margin:15px 0 5px 0;
    font-size:18px;
    color: #675769;
}

.product p{
    color:#777;
    font-size:14px;
}

.product span{
    display:block;
    margin:10px 0;
    font-weight:bold;
    color:#675769;
}

.product button{
    margin-bottom:15px;
    padding:10px 20px;
    border:none;
    background:#928292;
    color:white;
    border-radius:6px;
    cursor:pointer;
}

.product button:hover{
    background:#a390a5;
}

.first img{
    width: 350px;
    height: 130px;
    padding-top: 70px;
}


/*Responsive*/
@media only screen and (max-width: 800px){

    /* Header & Logo */
    header{
        flex-direction: column;
        padding: 30px 20px;
    }

    header img{
        margin: 0 auto;
        width: 200px; /* scales logo */
        height: auto;
    }

    nav ul{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding-left: 0;
    }

    nav ul li{
        width: 100%;
        text-align: center;
        margin: 5px 0;
    }

    nav ul li a{
        font-size: 16px;
        padding: 10px;
    }

    /* Main headings */
    .main-heading{
        margin-top: 30px;
    }

    .main-heading h1{
        font-size: clamp(20px, 5vw, 42px);
        width: 90%;
        margin: 0 auto 20px auto;
        background-color: rgba(240, 221, 237, 0.35);
    }

    .main-heading a{
        font-size: 16px;
        padding: 15px 30px;
    }

    /* Section 1 and 3 adjustments */
    #section-1, #section-3{
        min-height: auto;
        padding: 60px 20px;
    }

    #section-3 .title-box a{
        position: static;
        display: inline-block;
        margin-top: 20px;
        font-size: 20px;
        padding: 12px 30px;
    }

    /* Brands / Popular products */
    .brands-box,
    .brands-box2,
    .brands-box3{
        flex-direction: column;
        gap: 15px;
        align-items: center;
    }

    /* Products grid */
    .products-box{
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .product img{
        width: 100%;
        height: auto;
    }

    /* Forms */
    .form-row{
        flex-direction: column;
        gap: 10px;
    }

    input[type="text"], input[type="email"], textarea{
        width: 90%;
        margin: 0 auto 10px auto;
    }

    input[type="submit"].big-button{
        width: 90%;
        padding: 20px;
        font-size: 16px;
    }

}


    /* Footer */
    footer ul{
        flex-direction: row;
        text-align: center;
        padding: 15px 0;
    }

    footer ul li{
        margin: 5px 0;
    }


    footer h3{
    color: white;
    text-align: center;
}


</style>

</head>
<body>

    <section id="section-1_perf">
        <div class="container">
            <header>

                <img id="logo_perf" src="images/logo2.png">

                <nav class="nav_perf">
                    <ul>
                        <li class="active"><a href="index.html">Home</a></li>
                        <li class="active"><a href="about.html">About Us</a></li>
                        <li class="active"><a href="products.html">Products</a></li>
                        <li class="active"><a href="perfkits.html">Perf Kits</a></li>
                        <li class="active"><a href="contact.html">Contact Info</a></li>
                    </ul>
                </nav>
            </header>

        </div>
    </section>


    <section id="section-2_perf">
                <h2>Perfectil Beauty</h2>

    <div class="products-box">


        <div class="product"><img src="images/lipkit1.jpg"><h3>Lip Kit 1</h3><p>Make-Up</p><span>€20</span><button>Buy</button></div>

        <div class="product"><img src="images/lipkit2.jpg"><h3>Lip Kit 2</h3><p>Make-Up</p><span>€15</span><button>Buy</button></div>


    </div>
    </section>


    <footer>

        <div class="container">
            <div class="footer-links">

                <ul>
                    <li><a href="https://www.facebook.com/">Facebook</a></li>
                    <li><a href="https://www.instagram.com/?hl=en">Instagram</a></li>
                    <li><a href="https://www.tiktok.com/en/">TikTok</a></li>
                    <li><a href="https://www.twitter.new/">Twitter</a></li>
                    <li><a href="https://al.linkedin.com/">Linkedin</a></li>
                    <li><a href="https://www.threads.com/?hl=en">Threads</a></li>
                    <li><a href="https://www.google.com/">Google</a></li>
                    <li><a href="https://github.com/">Github</a></li>
                </ul>

                <h3>© 2026 Perfectil Beauty. All rights reserved.</h3>
                
            </div>
        </div>

    </footer>

</body>
</html>
