<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Project - Contact Info</title>
    <link rel="stylesheet" href="style.css">

<style>

#logo_contact{
    height: 165px;
    width: 300px;
    background-color: #ab95ad;
    border-radius: 50%;
}


/*Section 1*/
#section-1_contact{
    background-color: #8b738b;
    height: 750px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}


.container{
    margin-left: auto;
    margin-right: auto;
    height: 100%;
}


header{
    padding: 55px;
    display: flex;
    justify-content: space-around;
}


.nav_contact ul li{
    display: inline-block;
    padding: 10px 16px;
}


.nav_contact ul li a{
    text-decoration: none;
    color: white;
}


.nav_contact ul li.active{
    background-color: none;
    font-size: 20px;
}


.nav_contact ul li.active:hover{
    background-color: #ab95ad;
    border-radius: 5px;
    font-size: 20px;
}


.main-heading{
    margin-top: 148px;
    text-align: center;
}


.main-heading h1{
    color: white;
    font-size: 42px;
    font-weight: bold;
    margin-bottom: 60px;
}


.main-heading a{
    text-decoration: none;
    background-color: rgb(205, 191, 211);
    font-size: 18px;
    text-transform: uppercase;
    border-radius: 5px;
    padding: 25px 85px;
    color: white;
}


.title-box {
    text-align: center;
    width: 100%;
    margin-left: auto;
    margin-right: auto;
    font-size: 30px;
}


.line{
    margin-left: auto;
    margin-right: auto;
}

/*Container2*/
#container_contact{
    background-color: #8b738b;
    min-height: 820px;
    color: white;
}


#contact-form{
    max-width: 860px;
    margin-left: auto;
    margin-right: auto;
}


.form-row{
    display: flex;
}


input[type="text"], [type="email"]{
    width: 46%;
    height: 56px;
}


input[type="text"], [type="email"], textarea{
    font-family: 'Times New Roman', Times, serif;
    color: white;
    background-color: #78697a;
    border: none;
    font-size: 18px;
    margin: 16px;
    border-radius: 5px;
    padding-left: 26px;
}


textarea{
    height: 200px;
    width: 100%;
    padding-top: 24px;
}


input[type="submit"]{
    background-color: #725979;
    border: none;
    font-size: 18px;
    text-transform: uppercase;
    margin-left: auto;
    margin-right: auto;
    border-radius: 5px;
    margin-top: 60px;
}


.big-button{
    padding: 25px 85px;
    color: white;
}


/*Responsive*/
@media only screen and (max-width: 800px){

    /* Header & Logo */
    header{
        flex-direction: column;
        padding: 30px 20px;
    }

    header img{
        margin: 0 auto;
        width: 200px; /* scales logo */
        height: auto;
    }

    nav ul{
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        padding-left: 0;
    }

    nav ul li{
        width: 100%;
        text-align: center;
        margin: 5px 0;
    }

    nav ul li a{
        font-size: 16px;
        padding: 10px;
    }

    /* Main headings */
    .main-heading{
        margin-top: 30px;
    }

    .main-heading h1{
        font-size: clamp(20px, 5vw, 42px);
        width: 90%;
        margin: 0 auto 20px auto;
        background-color: rgba(240, 221, 237, 0.35);
    }

    .main-heading a{
        font-size: 16px;
        padding: 15px 30px;
    }

    /* Section 1 and 3 adjustments */
    #section-1, #section-3{
        min-height: auto;
        padding: 60px 20px;
    }

    #section-3 .title-box a{
        position: static;
        display: inline-block;
        margin-top: 20px;
        font-size: 20px;
        padding: 12px 30px;
    }

    /* Brands / Popular products */
    .brands-box,
    .brands-box2,
    .brands-box3{
        flex-direction: column;
        gap: 15px;
        align-items: center;
    }

    /* Products grid */
    .products-box{
        display: grid;
        grid-template-columns: 1fr;
        gap: 20px;
    }

    .product img{
        width: 100%;
        height: auto;
    }

    /* Forms */
    .form-row{
        flex-direction: column;
        gap: 10px;
    }

    input[type="text"], input[type="email"], textarea{
        width: 90%;
        margin: 0 auto 10px auto;
    }

    input[type="submit"].big-button{
        width: 90%;
        padding: 20px;
        font-size: 16px;
    }

}

    /* Footer */
    footer ul{
        flex-direction: row;
        text-align: center;
        padding: 15px 0;
    }

    footer ul li{
        margin: 5px 0;
    }

    footer h3{
    color: white;
    text-align: center;
}


</style>

</head>
<body>

    <section id="section-1_contact">
        <div class="container">
            <header>

                <img id="logo_contact" src="images/logo2.png">

                <nav class="nav_contact">
                    <ul>
                        <li class="active"><a href="index.html">Home</a></li>
                        <li class="active"><a href="about.html">About Us</a></li>
                        <li class="active"><a href="products.html">Products</a></li>
                        <li class="active"><a href="perfkits.html">Perf Kits</a></li>
                        <li class="active"><a href="contact.html">Contact Info</a></li>
                    </ul>
                </nav>
            </header>

            <div id="container_contact">
            <div class="title-box">
                <h2>Get in Touch</h2>
                <div class="line"></div>
            </div>

            <div id="contact-form">
                <form>
                    <div class="form-row">
                        <input type="text" name="name" placeholder="Your Name">
                        <input type="email" name="email" placeholder="Your Email">
                    </div>

                    <div class="form-row">
                        <textarea name="message" placeholder="Message"></textarea>
                    </div>

                    <div class="form-row">
                        <input type="submit" class="big-button" value="Send Message">
                    </div>

                </form>
            </div>
        </div>


        </div>
    </section>


</body>
</html>
